# Copy this file to config/config.yml and replace every path.
# Relative paths are resolved from config/. Never commit the completed file.

global:
  output_dir: "../runs"
  pipeline_seed: 1
  run_label: "p1"
  verbose: true
  save_stage_csvs: true
  autorun_pipeline: false
  append_timestamp_to_outputs: false
  resume_mode: false

stages:
  run_preflight_unit_test: true
  run_read_wave1_phase: true
  run_build_main_dataset_phase: true
  run_final_cv_tmle: true
  run_diagnostics: true
  run_multiseed_att: false

# Supply these only inside the approved restricted-use environment.
paths:
  wave1_inhome: "/restricted/AddHealth/Standard/Survey/W1/allwave1.xpt"
  birth_records: "/restricted/AddHealth/Standard/BirthRecords/brdw5.xpt"
  neighborhood_w1: "/restricted/AddHealth/Standard/Grouping/nhood1.xpt"
  inschool_w1: "/restricted/AddHealth/Standard/InSchool/Inschool.xpt"
  contextual_w1: "/restricted/AddHealth/Standard/Contextual/W1/Context1.xpt"
  health_w1: "/restricted/AddHealth/Standard/Contextual/W1/Health1.xpt"
  spatial_w1: "/restricted/AddHealth/Standard/Contextual/W1/Spatial.xpt"
  stchr95_w1: "/restricted/AddHealth/Standard/Contextual/W1/stchr95.xpt"
  polcon_w1: "/restricted/AddHealth/Standard/Contextual/W1/w1polcon.xpt"
  weights_w1: "/restricted/AddHealth/Standard/Weights/Homewt1.xpt"
  school_admin_w1: "/restricted/AddHealth/Standard/InSchool/Schadm1.xpt"
  wave2_inhome: "/restricted/AddHealth/Standard/Survey/W2/wave2.xpt"
  wave3_inhome: "/restricted/AddHealth/Standard/Survey/W3/wave3.xpt"
  wave4_inhome: "/restricted/AddHealth/Standard/Survey/W4/wave4.xpt"
  wave5_inhome: "/restricted/AddHealth/Standard/Survey/W5/wave5.xpt"
  mortality: "/restricted/AddHealth/Standard/Surveillance/Ndi19i.xpt"

# Run one verified outcome specification at a time.
outcome:
  family: "HoursWorked"
  family_member: null
  waves: 4
  compensation_transform: "identity"
  compensation_exact_only: false
  continuous_upper_quantile: 0.995

mortality_sensitivity:
  enabled: true
  composite_zero_at_death: true
